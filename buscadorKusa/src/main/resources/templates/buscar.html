<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Productos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#2563eb;--hover:#1d4ed8;--bg:#f8fafc;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;}
        body{font-family:Inter,sans-serif;background:var(--bg);margin:0;padding:40px}
        .container{max-width:850px;margin:auto}
        .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .btn{background:var(--primary);color:#fff;padding:10px 18px;border:none;border-radius:8px;cursor:pointer;text-decoration:none}
        .btn.green{background:#16a34a}
        .search-form{display:flex;gap:10px}
        .search-input{flex:1;padding:12px;border:1px solid var(--border);border-radius:8px}
        .card{margin-top:20px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px}
        .info-group{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
        .info-group:last-child{border-bottom:none}
        .copy-button{margin-top:15px}
        .suggestions{background:#fff;border:1px solid var(--border);border-radius:8px;margin-top:4px}
        .suggestion-item{padding:10px;cursor:pointer}
        .suggestion-item:hover{background:#eef4ff}
        .modal{display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.45)}
        .modal-content{background:#fff;width:420px;margin:10% auto;padding:20px;border-radius:10px}
    </style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <h2>Buscador de Productos</h2>
        <button class="btn green" onclick="document.getElementById('modalImportar').style.display='block'">📥 Importar Excel</button>
    </div>


    <form action="/buscar" method="get">

        <div class="search-form">

            <input
                    class="search-input"
                    id="buscar"
                    type="text"
                    name="codigo"
                    autocomplete="off">

            <button class="btn">Buscar</button>

        </div>

    </form>

    <div id="sugerencias" class="suggestions"></div>
    <div class="card" th:if="${producto!=null}">
        <div class="info-group"><b>Código</b><span id="p-codigo" th:text="${producto.codigo}"></span></div>
        <div class="info-group"><b>Descripción</b><span id="p-desc" th:text="${producto.descripcion}"></span></div>
        <div class="info-group"><b>Unidad</b><span id="p-unidad" th:text="${producto.unidad}"></span></div>
        <div class="info-group"><b>Precio Unitario</b><span id="p-preciou" th:text="${'S/ '+producto.precioUnitario}"></span></div>
        <div class="info-group"><b>Precio Caja</b><span id="p-precioc" th:text="${'S/ '+producto.precioCaja}"></span></div>
        <div class="info-group"><b>Cantidad Caja</b><span id="p-cantc" th:text="${producto.cantidadCaja}"></span></div>
        <div class="info-group"><b>Precio Distribuidor</b><span id="p-distribuidor" th:text="${'S/ '+producto.precioDistribuidor}"></span></div>
        <button type="button" class="btn copy-button" onclick="copiarProducto()">📋 Copiar respuesta</button>
    </div>

    <div id="modalImportar" class="modal">

        <div class="modal-content">

            <h3>Importar Excel</h3>

            <form id="formImportar" enctype="multipart/form-data">

                <input
                        type="file"
                        id="archivo"
                        name="archivo"
                        accept=".xlsx"
                        required>

                <br><br>

                <button
                        type="submit"
                        class="btn green">

                    📥 Importar

                </button>

                <button
                        type="button"
                        class="btn"
                        onclick="document.getElementById('modalImportar').style.display='none'">

                    Cerrar

                </button>

            </form>

            <br>

            <div id="estadoImportacion"></div>

        </div>

    </div>
</div>

<script>
    function copiarProducto() {

    const codigo = document.getElementById("p-codigo")?.innerText || "";
    const precioU = document.getElementById("p-preciou")?.innerText || "";
    const precioC = document.getElementById("p-precioc")?.innerText || "";
    const cantidadC = document.getElementById("p-cantc")?.innerText || "";
    const precioDistribuidor = document.getElementById("p-distribuidor")?.innerText || "";

    const texto = `Código: ${codigo}

💰 Precio Unitario: ${precioU}
📦 Precio Caja (${cantidadC} unidades): ${precioC}
🤝 Precio Distribuidor: ${precioDistribuidor}


    navigator.clipboard.writeText(texto).then(() => {

        const boton = document.querySelector(".copy-button");

        boton.innerHTML = "✅ Copiado";
        boton.classList.add("copied");

        setTimeout(() => {

            boton.innerHTML = "📋 Copiar respuesta";
            boton.classList.remove("copied");

        }, 1800);

    });

}
    const formImportar = document.getElementById("formImportar");

formImportar.addEventListener("submit", async function(e){

    e.preventDefault();

    const estado = document.getElementById("estadoImportacion");

    estado.className = "estado-cargando";
    estado.innerHTML = "⏳ Importando Excel...";

    const datos = new FormData(this);

    try{

        const response = await fetch("/importar",{

            method:"POST",

            body:datos

        });

        const mensaje = await response.text();

        if(mensaje === "OK"){

            estado.className = "estado-ok";
            estado.innerHTML = "✅ Excel importado correctamente.";

            setTimeout(function(){

                document.getElementById("modalImportar").style.display="none";

                estado.innerHTML="";

                formImportar.reset();

            },1500);

        }else{

            estado.className="estado-error";

            estado.innerHTML="❌ Error al importar.";

        }

    }catch(e){

        estado.className="estado-error";

        estado.innerHTML="❌ Error al importar.";

    }

});
    const buscador = document.getElementById("buscar");
const sugerencias = document.getElementById("sugerencias");

buscador.addEventListener("keyup", function () {

    const texto = this.value.trim();

    if (texto.length < 2) {
        sugerencias.innerHTML = "";
        return;
    }

    fetch("/api/productos?texto=" + encodeURIComponent(texto))
        .then(response => response.json())
        .then(datos => {

            sugerencias.innerHTML = "";

            datos.forEach(producto => {

                sugerencias.innerHTML += `
                    <div class="suggestion-item"
                         onclick="seleccionarProducto('${producto.codigo}')">

                        <strong>${producto.codigo}</strong><br>
                        ${producto.descripcion}

                    </div>
                `;

            });

        });

});

function seleccionarProducto(codigo){

    window.location.href="/buscar?codigo="+codigo;

}
</script>
</body>
</html>
